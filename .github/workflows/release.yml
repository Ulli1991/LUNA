name: release

# INACTIVE until the repository is public and the PyPI project trusts this workflow
# (PyPI Trusted Publishing, OIDC: no API token is stored anywhere). One-time setup in
# CONTRIBUTING.md, "Releasing". On a tag vX.Y.Z it builds the sdist and wheel, checks them,
# and uploads to PyPI from the `pypi` environment.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches the version in pyproject.toml
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version $v"; exit 1; }
      - name: README links absolute at this tag (PyPI has no repository to resolve them in)
        run: python tools/pypi_readme.py "${GITHUB_REF_NAME}"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Smoke test the wheel in a clean venv
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/python -c "import luna; print(luna.__version__)"
          cp "$(/tmp/v/bin/python -c 'import luna.template_config as t; print(t.__file__)')" /tmp/run.py
          /tmp/v/bin/luna /tmp/run.py Nx=64 PLOT_AFTER_SIM=False output_dir=/tmp/luna_smoke/sod64
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/luna-hydro
    permissions:
      id-token: write          # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
