[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-hydro"
version = "0.1.0"
description = "A differentiable JAX-based hydrodynamics code for stratified flows, ISM physics, and galactic winds"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "Ulrich Philipp Steinwandel"}]
keywords = ["hydrodynamics", "JAX", "GPU", "astrophysics", "ISM", "MHD"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Runtime dependencies. JAX/jaxlib pin matches /raven/u/uli/jax-env where
# all paper-figure runs were produced. GPU build comes from the CUDA wheel
# index — see README.md.
dependencies = [
    "jax==0.10.1",
    "jaxlib==0.10.1",
    "h5py>=3.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7.0"]
dev = ["black>=24.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hydro*", "ic_generation*", "setup*", "time_integration*",
           "file_io*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running test (full sim or shard_map JIT). Deselect with -m 'not slow'.",
    "multigpu: needs a real multi-process / multi-GPU launch; auto-skipped unless LUNA_MULTIGPU_TEST=1.",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Conservative: just flag obvious issues. We can crank these up later.
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # line too long — handled by black
    "E731",  # lambda assignment
    "B008",  # function call in default arg (used for dataclass defaults)
]
